# Exemption for the Trivy secret scan of the Docker image (docker_scan, pass 3).
# Procedure: docs/exemption-process.md. Type: accepted risk. Owner: spaxore. Decision date: 2026-11-14. Review before: 2027-02-12.
# The only exempted secret is the self-signed TLS key that ships with the training application. It protects nothing, and the application
# loads it at start-up (server.js), so it cannot be removed from the image without breaking the app. The same file is exempted in
# .gitleaksignore. Any other secret in the image still blocks the build.
allow-rules:
  - id: demo-tls-certificates
    description: Self-signed demo TLS certificates of the training application (artifacts/cert and app/cert)
    path: (artifacts/cert/|app/cert/)
