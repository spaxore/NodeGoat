# Local Jenkins for the DevSecOps lab. Start it with: docker compose up --build -d
services:
  jenkins:
    build: .
    container_name: jenkins
    # Runs as root so it can use the mounted Docker socket on Docker Desktop.
    # Lab trade-off: root plus the Docker socket gives Jenkins control of the host's Docker.
    # In production use isolated build agents instead.
    user: root
    ports:
      - "8080:8080"
    environment:
      JAVA_OPTS: "-Xmx1g"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  jenkins_home:
